# The one public entry point. It serves the React app and sends API calls and short links to the Node copies.

upstream ziplink_api {
    # Plain round robin: each request goes to the next copy in turn.
    # A copy that fails 3 times is skipped for 10 seconds, then tried again.
    server app1:5000 max_fails=3 fail_timeout=10s;
    server app2:5000 max_fails=3 fail_timeout=10s;
    server app3:5000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Every proxied request tells the app who the visitor is. The app trusts exactly one proxy
    # (TRUST_PROXY=1), so rate limits count the visitor and not this container.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # If a copy is down or answers with an error, try the next one before the visitor sees a failure.
    proxy_next_upstream error timeout http_502 http_503;

    # API: login, links, analytics, Google sign-in.
    # ^~ makes this prefix win over the regex rules below, so /api/... can never be taken by them.
    location ^~ /api/ {
        proxy_pass http://ziplink_api;
        add_header X-Upstream $upstream_addr always;
    }

    # Pages of the React app. Each of these names is reserved in the backend, so no short code can use it.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(login|register|urls|analytics|auth|expired|not-active|protected)(/|$) {
        try_files /index.html =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A short code is one path segment, so a path with more segments is not one: show the app's 404 page.
    location ~ ^/[^/]+/.+ {
        try_files /index.html =404;
    }

    # Anything else is a short code, for example /aB3xK9q.
    location / {
        proxy_pass http://ziplink_api;
        add_header X-Upstream $upstream_addr always;
    }
}
